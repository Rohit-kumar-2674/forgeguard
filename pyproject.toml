[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "forgeguard-cli"
version = "0.2.0"
description = "Local-first repository security and health scanner"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Rocky" }]
keywords = ["security", "repository", "github-actions", "sbom", "oss"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
dependencies = []

[project.urls]
Repository = "https://github.com/Rohit-kumar-2674/forgeguard"
Issues = "https://github.com/Rohit-kumar-2674/forgeguard/issues"
Documentation = "https://github.com/Rohit-kumar-2674/forgeguard#readme"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
forgeguard = "forgeguard.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/forgeguard"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
